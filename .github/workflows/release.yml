name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布并构建的 tag（如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

env:
  # auth-hub / template-business-server 的 go.mod 声明 go >= 1.25.0，
  # 依赖侧硬下限 1.23.0（GoFrame v2 / golang.org/x/crypto）
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 发布前全量校验：三个 Go 模块测试 + 前端构建
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [auth-hub, template-oidc-cli, template-business-server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: 运行测试
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

  # ─────────────────────────────────────────────────────────────
  # 2. 前端构建，产物作为嵌入式静态资源分发
  # ─────────────────────────────────────────────────────────────
  web:
    name: Web build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: idp-web
            dir: auth-hub/web/idp-web
          - app: template-web
            dir: template-business-server/web/template-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.dir }}

      - run: npm run build
        working-directory: ${{ matrix.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: ${{ matrix.dir }}/dist
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3. 多平台编译并打包
  #
  # 依赖说明：三个模块都是**纯 Go**，没有 cgo 依赖 ——
  #   · auth-hub：gf 的 pgsql 驱动（lib/pq）
  #   · template-business-server：gf 的 sqlite 驱动（底层 glebarez/go-sqlite，纯 Go 实现）
  #   · template-oidc-cli：只用标准库 + x/crypto
  # 因此 CGO_ENABLED=0 一把梭，交叉编译不需要任何 gcc 工具链。
  # （darwin/Windows 仍只分发源码包：那与 cgo 无关，是不想多维护一套产物与签名流程。）
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [verify, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # ── 嵌入前端产物（部署方案A：Go 直接托管 dist） ──
      - uses: actions/download-artifact@v4
        with:
          name: web-idp-web
          path: auth-hub/web/idp-web/dist

      - uses: actions/download-artifact@v4
        with:
          name: web-template-web
          path: template-business-server/web/template-web/dist

      # ── 版本号注入 ──
      - name: 解析版本
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 编译（linux 交叉编译，纯 Go）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # 纯 Go，关掉 cgo：产物静态链接、不依赖目标机 glibc 版本
          CGO_ENABLED: '0'
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          echo "GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED"

          ( cd auth-hub && go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o /tmp/auth-hub . )
          ( cd template-business-server && go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o /tmp/go-ah-template . )
          ( cd template-oidc-cli && go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o /tmp/oidc-cli . )

      - name: 打包
        run: |
          set -euo pipefail
          NAME="go-ah_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${NAME}"
          cp /tmp/auth-hub /tmp/go-ah-template /tmp/oidc-cli "dist/${NAME}/"
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          ( cd dist && tar -czf "${NAME}.tar.gz" "${NAME}" )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3b. 源码包：含已构建前端产物，macOS/Windows 用户本地 go build
  # ─────────────────────────────────────────────────────────────
  source-bundle:
    name: Source bundle (with web dist)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-idp-web
          path: auth-hub/web/idp-web/dist

      - uses: actions/download-artifact@v4
        with:
          name: web-template-web
          path: template-business-server/web/template-web/dist

      - name: 解析版本
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包源码（前端 dist 已内嵌，无需 npm）
        run: |
          set -euo pipefail
          NAME="go-ah_${{ steps.vars.outputs.version }}_source"
          # 归档文件必须放在被 tar 的目录树之外：
          # 若写入 ./dist/...，tar 会在读取过程中发现自身输出在变化，
          # 报 "file changed as we read it" 并以 exit 1 失败。
          rm -rf ./bundle ./dist
          mkdir -p "./bundle/${NAME}"

          tar -cf - \
            --exclude='./.git' \
            --exclude='./.codebuddy' \
            --exclude='./bundle' \
            --exclude='./dist' \
            --exclude='*.db' \
            --exclude='*/node_modules' \
            . | ( cd "./bundle/${NAME}" && tar -xf - )

          # 校验：前端产物必须已包含在内
          test -f "./bundle/${NAME}/auth-hub/web/idp-web/dist/index.html" \
            || { echo "::error::源码包缺少 auth-hub 前端产物"; exit 1; }
          test -f "./bundle/${NAME}/template-business-server/web/template-web/dist/index.html" \
            || { echo "::error::源码包缺少业务前端产物"; exit 1; }

          ( cd ./bundle && tar -czf "../${NAME}.tar.gz" "${NAME}" )

          echo "产物清单："
          ls -lh "${NAME}.tar.gz"

          # 注意：在 set -o pipefail 下不能写成 `tar -tzf x | head -n 20`，
          # head 提前关闭管道会让 tar 收到 SIGPIPE（stdout: write error），
          # 进而把整个步骤判为失败。这里改为先落盘再截取。
          tar -tzf "${NAME}.tar.gz" > /tmp/listing.txt
          echo "包内文件总数：$(wc -l < /tmp/listing.txt)"
          echo "包内顶层结构（前 15 行）："
          sed -n '1,15p' /tmp/listing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: go-ah_*_source.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 4. 创建 GitHub Release 并附加全部构建产物
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, source-bundle]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh release-assets

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: go-ah ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## go-ah ${{ steps.vars.outputs.tag }}

            OIDC PKCE 单点登录参考实现（auth-hub 认证中心 + 业务接入模板 + 命令行客户端）。

            ### 产物说明

            | 文件 | 说明 |
            |---|---|
            | `go-ah_<ver>_linux_amd64.tar.gz` | Linux x86_64 可执行文件（含认证中心 / 业务模板 / 命令行客户端，前端已内嵌） |
            | `go-ah_<ver>_linux_arm64.tar.gz` | Linux ARM64 可执行文件 |
            | `go-ah_<ver>_source.tar.gz` | 源码包（**已包含构建好的前端 dist**，macOS/Windows 本地 `go build` 即可，无需 npm） |

            > 未提供 macOS/Windows 二进制：SQLite 驱动依赖 cgo，跨平台交叉编译意义不大。
            > 请下载 source 包本地构建 —— 前端产物已内嵌，无需再装 Node。

            ### 快速开始

            ```bash
            # 认证中心（默认 127.0.0.1:8080）
            ./auth-hub

            # 业务平台（默认 127.0.0.1:8081，BIZ_TOKEN_SECRET 必填 ≥16 字符）
            export BIZ_TOKEN_SECRET=$(openssl rand -hex 32)
            ./go-ah-template

            # 命令行客户端：login → whoami → logout
            ./oidc-cli login
            ```

            详见仓库根目录 [`README.md`](../README.md)。
