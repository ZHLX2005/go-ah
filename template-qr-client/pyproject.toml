[project]
name = "goah-qr-client"
version = "1.0.0"
description = "go-ah 统一登录平台 · 扫码登录的 Python 客户端（终端出二维码 + 模拟手机端确认）"
requires-python = ">=3.10"
# segno 而不是 qrcode：它是纯 Python 实现、不拉 Pillow，且专门带了终端输出
# （print_terminal 用半角块字符，一行能塞两个像素模块，二维码在终端里
# 尺寸才够手机对焦）。本客户端不需要保存图片文件，所以图像后端是纯负担。
dependencies = [
    "requests>=2.31",
    "segno>=1.6",
]

[project.scripts]
goah-qr = "goah_qr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goah_qr"]
