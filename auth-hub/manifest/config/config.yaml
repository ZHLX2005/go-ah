# =============================================================================
# auth-hub 配置（GoFrame 标准位置：manifest/config/config.yaml）
#
# 这里写的值都只是**兜底默认值**，实际部署一律由环境变量覆盖：
#   IDP_DSN / IDP_ISSUER / IDP_ADDR / IDP_SIGNING_KEY_PEM
#   GSAC_REDIRECT_URI / GSAC_POST_LOGOUT_URI
#
# 为什么要留这份文件：环境变量只出现在 GitHub secrets 和容器定义里，
# 光看仓库看不出这个服务有哪些可配项、默认指向哪。把它写成配置文件，
# 可配项与默认值就有了可读的落点；改配置不必改代码。
# =============================================================================

idp:
  # 数据库连接串。支持 postgres:// 与 pgsql: 两种形式；
  # search_path 决定落哪个 schema（默认 auth_hub，与 gs-ac 共享实例但互不干扰）。
  dsn: ""

  # IdP 对外标识。必须填**公网可达**的地址，否则：
  #   - 发现文档里的端点指向本地，业务侧拉不到；
  #   - id_token 的 iss 与业务侧期望不一致，直接验签失败。
  issuer: "http://127.0.0.1:8080"

  # 监听地址。容器内必须绑 0.0.0.0，否则容器外访问不到。
  addr: "127.0.0.1:8080"

  # 前端产物目录（可选）。容器部署下前端由 nginx 容器托管，此处目录不存在，
  # Go 侧只提供 API —— 这是预期行为，不算异常。
  webDist: "./web/idp-web/dist"

  # 显式注入的 RSA 私钥（PKCS#8 PEM）。留空表示用数据库里持久化的那把；
  # 多副本部署时才需要显式注入，保证各副本签发的 id_token 可互验。
  signingKeyPem: ""

  gsac:
    # gs-ac 客户端的回调白名单，空格分隔多个（任一命中即通过）。
    # 换域名/端口时改这里即可，无需手工改库。
    redirectUri: ""
    postLogoutUri: ""
