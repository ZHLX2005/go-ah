# =============================================================================
# 统一登录平台前端（idp-web）—— nginx 底座
#
# 职责：① 托管 SPA ② 把三类后端路径反代到 auth-hub 容器。
#
# ⚠️ 这个拓扑会改变 IDP_ISSUER 的取值，必须一起改，否则整个 OIDC 链路会断：
#
#   改之前（Go 直接托管）：issuer = http://<host>:8080
#   改之后（nginx 在前）  ：issuer = http://<host>:8082   ← nginx 的对外地址
#
#   原因：发现文档里 authorization_endpoint / end_session_endpoint 都是
#   「issuer + 路径」拼出来的，而这两个端点**由浏览器访问**。浏览器只认
#   nginx 的地址，若 issuer 仍写 8080，浏览器就会绕过 nginx 直连容器端口 ——
#   一旦 8080 没有对外放行，登录会卡在「点了没反应」。
#
#   连带影响：gs-ac 侧的 OIDC_ISSUER 必须改成同一个 nginx 地址。
#   两个deploy.yml 都做了前置校验尽量提前拦住这类不一致。
#
# 上游主机名 auth-hub 是后端容器在共享 docker 网络里的名字/别名，
# 由 deploy.yml 把两个容器加入同一网络时建立。
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 构建产物带内容 hash，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 必须每次回源校验：否则发版后用户拿到的还是旧页面，
    # 而旧页面引用的 hash 资源已被清理 → 白屏
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback：/login、/consent、/admin/* 都是前端路由，必须回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端路径反代 ──────────────────────────────────────────────────────
    # 注意这里**不剥离前缀**：auth-hub 的路由本身就带 /api、/oauth2、/.well-known
    # （与 gs-ac 那边不同 —— 那边后端没有 /api 前缀才需要 rewrite）。
    # 用 proxy_pass 不带结尾斜杠的形式，原样透传 URI。

    # 页面配套 API：登录 / 授权确认 / 管理后台
    location /api/ {
        proxy_pass http://auth-hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }

    # OIDC 端点：授权 / 令牌 / 登出 / userinfo / revoke
    location /oauth2/ {
        proxy_pass http://auth-hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 发现文档与 JWKS —— **这条最容易被漏掉**。
    # 漏了它，所有依赖方（gs-ac 等）的 OIDC 初始化都会失败，
    # 而报错只出现在调用方日志里，从认证中心这边看还以为一切正常。
    location /.well-known/ {
        proxy_pass http://auth-hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 发现文档与公钥可以被依赖方缓存，但别缓存太久 ——
        # 签名密钥轮换后缓存太长会让依赖方拿到过期公钥
        add_header Cache-Control "public, max-age=300";
    }

    # 健康检查：auth-hub 没有专门的 /health 端点，统一用发现文档代替
    # （它才是 OIDC 链路真正依赖的东西，且能顺带验证 issuer 注入正确）。
    # deploy.yml 的探针口径也是这个。
    location = /healthz {
        proxy_pass http://auth-hub:8080/.well-known/openid-configuration;
        proxy_set_header Host $host;
        access_log off;
    }
}
